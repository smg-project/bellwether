[project]
name = "bellwether"
version = "0.0.1"
description = "Token-level conformance for SMG: compare the gateway's rendered prompt tokens and parsed responses with the model vendor's reference, vLLM and SGLang, with no GPU."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# The template oracle renders with the transformers, tokenizers and jinja2 that vLLM's image ships
# (vllm/vllm-openai:v0.31.0), so a reference and vLLM's render come from the same code. Move them with that pin.
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=1.33",  # bellwether models and the Hugging Face importers ask the Hub through it
    "jinja2==3.1.6",
    "jsonschema>=4.23",
    "pyarrow>=25.0.1",
    "tokenizers==0.23.2",
    "transformers==5.17.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema-rs>=0.29",
    "pytest>=8.3",
    "ruff>=0.6",
]
# What vendor tokenizers import, installed in the vendor-code oracle's sandbox image only (docker/vendor).
vendor = ["tiktoken>=0.9"]
# Engine oracles (vLLM, SGLang) are deliberately not extras: they must never share one
# environment. `bellwether record --oracle vllm|sglang` runs inside the engine's official image.

[project.scripts]
bellwether = "bellwether.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bellwether"
module-root = "src"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "loopback: the test may connect to a server it runs on 127.0.0.1 or ::1; every other address and name stays refused (tests/conftest.py)",
]
