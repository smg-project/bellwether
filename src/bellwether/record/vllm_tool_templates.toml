# vLLM's example tool chat templates and the checkpoints vLLM's docs name each one for (bellwether #59).
#
# Read by hand from vLLM's docs at the commit below: the pages its docs build makes, every docs/**/*.md
# and one page per example under examples/<category>/ (docs/mkdocs/gen_files/generate_examples.py). Two
# pages name an examples/tool_chat_template_*.jinja file for a checkpoint, and every entry cites the lines
# that do. A checkpoint is written as the page writes it, `*` included, and matched without regard to
# case, as the Hub resolves ids: it redirects Salesforce/Llama-xLAM-2-8B-fc-r to ...-8b-fc-r. A template
# no page names for a checkpoint has no entry, whatever its file name says. Each file is pinned by the
# sha256 of its bytes at the commit, checked against GitHub's blob id when it was read.
#
# docs/benchmark-sets.md, "Second references from vLLM's example tool templates", has the rules. Nothing
# reads this file yet; the recorder will, checking every sha256 here before any use. Re-read the pages at
# each new vLLM pin; the diff of this file is the review.

schema_version = 1

[vllm]
repo = "vllm-project/vllm"
ref = "v0.31.0"
commit = "db9527a46873454610df6dbedf79a36d6bf1a7f6"

[pages]  # path at the commit -> sha256 of its bytes
"docs/features/tool_calling.md" = "e8256a3ef40db8707ebc2cbfb2738dceabfff64b6d69d8d41d6e17594d036417"
"examples/tool_calling/openai_chat_completion_client_with_tools.py" = "0df23c1075a62b0e5cbc0da1e2b1d89898ff460a42cc0f35f2323978b2f2afd0"

# One [[template]] per template a page names, with one [[template.named_for]] per statement that names it:
# the checkpoints, the page and lines, and the flags the same lines give for vLLM's side.

