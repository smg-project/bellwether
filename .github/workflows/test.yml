name: test

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run it supersedes; runs on main each finish.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # The pinned files (the BFCL wheel and the LICENSE at the commit it was built from, GSM8K's and MGSM's files and
      # the SWE-bench repositories' license files at their commits, Hugging Face files under huggingface/ with the
      # blobs Xet keeps there once for the whole cache) are named and hashed in the importers, so the key changes
      # whenever a pin does.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bellwether/datasets
          key: bellwether-datasets-${{ hashFiles('src/bellwether/importers/**') }}
          # Every pinned file is checked against its sha256 when read, so an older cache serves whatever it still
          # holds and an importer's change downloads only the files it adds.
          restore-keys: bellwether-datasets-
      # An import past corpus_sets.LIMIT keeps every set compressed in Git LFS, and --check reads them whole; the
      # checkout leaves Git LFS files as pointers. Their objects are cached by the pointers, so an unchanged set is
      # fetched once.
      - uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-corpus-${{ hashFiles('corpus/**/*.jsonl.zst') }}
      # An import's --check depends only on the corpus it compares, the importers' code and pins under src/, the locked
      # environment and the steps below: checks that passed on the same files (on main, or earlier in the pull request)
      # are not run again, as a shard of sets is not. A pull request that changes none of them, as a fixtures pull
      # request does, skips the twenty minutes or so the SWE-Hero and tau2 checks take. The key is taken before the
      # fetch below, while the corpus's Git LFS sets are pointers, and a pointer names its set's sha256.
      - name: The import checks' key
        id: imports
        run: >-
          echo "key=checked-imports-${{ hashFiles('corpus/**', 'src/**', 'uv.lock', 'pyproject.toml', '.python-version',
          '.github/workflows/test.yml') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: imported
        with:
          path: ${{ runner.temp }}/checked-imports
          key: ${{ steps.imports.outputs.key }}
      - name: Fetch the corpus sets kept in Git LFS
        run: git lfs pull --include 'corpus/**/*.jsonl.zst' --exclude ''
      - if: steps.imported.outputs.cache-hit != 'true'
        run: uv run bellwether import bfcl --check
      - if: steps.imported.outputs.cache-hit != 'true'
        run: uv run bellwether import gsm8k --check
      - if: steps.imported.outputs.cache-hit != 'true'
        run: uv run bellwether import mgsm --check
      - if: steps.imported.outputs.cache-hit != 'true'
        run: uv run bellwether import shapes --check
      - if: steps.imported.outputs.cache-hit != 'true'
        run: uv run bellwether import hermes --check
      - if: steps.imported.outputs.cache-hit != 'true'
        run: uv run bellwether import swebench --check
      - if: steps.imported.outputs.cache-hit != 'true'
        run: uv run bellwether import glaive-v2 --check
      - if: steps.imported.outputs.cache-hit != 'true'
        run: uv run bellwether import swehero --check
      - if: steps.imported.outputs.cache-hit != 'true'
        run: uv run bellwether import tau2 --check
      - name: The shape patterns' recordings are what the pinned regex gives
        run: uv run bellwether patterns --check
      # Saved only after every import check above passed.
      - name: Remember the corpus the import checks passed
        if: steps.imported.outputs.cache-hit != 'true'
        run: echo "${{ steps.imports.outputs.key }}" > "$RUNNER_TEMP/checked-imports"
      - uses: actions/cache/save@v6
        if: steps.imported.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/checked-imports
          key: ${{ steps.imports.outputs.key }}
      # The image sets' files stay Git LFS pointers here; each pointer names its content's sha256 and size, which the
      # check compares with the set lines. An image importer's --check, with its downloads, runs in corpus-images.yml.
      - name: The image sets and their files agree
        run: uv run bellwether images check
      - name: The README's tables are what fixtures/ and corpus/ hold
        run: uv run bellwether count --readme README.md --check
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bellwether/registries
          key: bellwether-registries-${{ hashFiles('src/bellwether/models/pins.py') }}
      - name: The committed list of models equals a fresh build at the pins
        run: uv run bellwether models --registry-only --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Benchmark sets are committed as Git LFS pointers
        run: git lfs fsck --pointers
      - run: uv run pytest -q

  # A pull request's new benchmark sets are read whole, about ten minutes a compressed gigabyte, and a runner fetches each
  # into its working tree and its Git LFS store both. So they are checked in shards of about 5 GB, each on a runner of
  # its own, and a pull request can carry many groups' sets at the wall time of one shard. The test job above leaves
  # them as pointers, which the tests skip.
  sets-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        run: echo "shards=$(python3 scripts/set_shards.py "origin/$BASE_REF" --matrix)" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.base_ref }}

  sets:
    needs: sets-plan
    if: needs.sets-plan.outputs.shards != '[]'
    name: sets ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.sets-plan.outputs.shards) }}
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # A set's check depends only on its bytes, which its pointer names by sha256 and size, and on the checking code:
      # a shard that passed on the same pointers with the same code earlier in the pull request (before a rebase, say)
      # is not fetched again.
      - name: This shard's sets
        id: shard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/set_shards.py "origin/$BASE_REF" --shard ${{ matrix.shard }} > "$RUNNER_TEMP/shard.txt"
          pointers=$(xargs -r -a "$RUNNER_TEMP/shard.txt" cat | sha256sum | cut -c1-64)
          echo "key=checked-sets-$pointers-${{ hashFiles('src/**', 'tests/**', 'uv.lock') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: checked
        with:
          path: .checked-sets
          key: ${{ steps.shard.outputs.key }}
      - name: Fetch this shard's sets
        if: steps.checked.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 400 paths per pull keeps each --include argument well under Linux's 131,072-byte cap.
          xargs -r -n 400 -a "$RUNNER_TEMP/shard.txt" sh -c 'git lfs pull --include "$(printf "%s," "$@" | sed "s/,$//")" --exclude ""' sh
      - name: Check this shard's sets
        if: steps.checked.outputs.cache-hit != 'true'
        run: uv run pytest -q tests/test_record.py -k test_committed_fixtures_are_canonical_sorted_and_valid
      # Saved only after the check passed with the sets fetched.
      - name: Remember the sets this shard checked
        if: steps.checked.outputs.cache-hit != 'true'
        run: cp "$RUNNER_TEMP/shard.txt" .checked-sets
      - uses: actions/cache/save@v6
        if: steps.checked.outputs.cache-hit != 'true'
        with:
          path: .checked-sets
          key: ${{ steps.shard.outputs.key }}
