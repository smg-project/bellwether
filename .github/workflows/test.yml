name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # The pinned files (the BFCL wheel, GSM8K's files at their commit) are named and hashed in the importers, so the
      # key changes whenever a pin does.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bellwether/datasets
          key: bellwether-datasets-${{ hashFiles('src/bellwether/importers/**') }}
      - run: uv run bellwether import bfcl --check
      - run: uv run bellwether import gsm8k --check
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bellwether/registries
          key: bellwether-registries-${{ hashFiles('src/bellwether/models/pins.py') }}
      - name: The committed list of models equals a fresh build at the pins
        run: uv run bellwether models --registry-only --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Benchmark sets are committed as Git LFS pointers
        run: git lfs fsck --pointers
      - name: Fetch the benchmark sets this pull request changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # 400 paths per pull keeps each --include argument well under Linux's 131,072-byte cap.
          git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" -- 'fixtures/**/*.jsonl.zst' \
            | xargs -r -n 400 sh -c 'git lfs pull --include "$(printf "%s," "$@" | sed "s/,$//")" --exclude ""' sh
      - run: uv run pytest -q
