name: test

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run it supersedes; runs on main each finish.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # The pinned files (the BFCL wheel and the LICENSE at the commit it was built from, GSM8K's and MGSM's files and
      # the SWE-bench repositories' license files at their commits, Hugging Face files under huggingface/ with the
      # blobs Xet keeps there once for the whole cache) are named and hashed in the importers, so the key changes
      # whenever a pin does.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bellwether/datasets
          key: bellwether-datasets-${{ hashFiles('src/bellwether/importers/**') }}
          # Every pinned file is checked against its sha256 when read, so an older cache serves whatever it still
          # holds and an importer's change downloads only the files it adds.
          restore-keys: bellwether-datasets-
      # An import past corpus_sets.LIMIT keeps every set compressed in Git LFS, and --check reads them whole; the
      # checkout leaves Git LFS files as pointers. Their objects are cached by the pointers, so an unchanged set is
      # fetched once.
      - uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-corpus-${{ hashFiles('corpus/**/*.jsonl.zst') }}
      - name: Fetch the corpus sets kept in Git LFS
        run: git lfs pull --include 'corpus/**/*.jsonl.zst' --exclude ''
      - run: uv run bellwether import bfcl --check
      - run: uv run bellwether import gsm8k --check
      - run: uv run bellwether import mgsm --check
      - run: uv run bellwether import shapes --check
      - run: uv run bellwether import hermes --check
      - run: uv run bellwether import swebench --check
      - run: uv run bellwether import glaive-v2 --check
      - run: uv run bellwether import swehero --check
      - run: uv run bellwether import tau2 --check
      - name: The README's tables are what fixtures/ and corpus/ hold
        run: uv run bellwether count --readme README.md --check
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bellwether/registries
          key: bellwether-registries-${{ hashFiles('src/bellwether/models/pins.py') }}
      - name: The committed list of models equals a fresh build at the pins
        run: uv run bellwether models --registry-only --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Benchmark sets are committed as Git LFS pointers
        run: git lfs fsck --pointers
      # The tests read a pull request's new benchmark sets whole, which takes about an hour for 9 GB. A set's check
      # depends only on its bytes, which its pointer names by sha256 and size, and on the checking code. So a run
      # that passed on the same pointers with the same code earlier in the same pull request (before a rebase, say)
      # leaves nothing to fetch, and the tests skip the sets they find as pointers.
      - name: The benchmark sets this pull request changes
        id: changed
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" -- 'fixtures/**/*.jsonl.zst' | sort > "$RUNNER_TEMP/changed.txt"
          pointers=$(xargs -r -a "$RUNNER_TEMP/changed.txt" cat | sha256sum | cut -c1-64)
          echo "count=$(wc -l < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"
          echo "key=checked-sets-$pointers-${{ hashFiles('src/**', 'tests/**', 'uv.lock') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: checked
        if: github.event_name == 'pull_request' && steps.changed.outputs.count != '0'
        with:
          path: .checked-sets
          key: ${{ steps.changed.outputs.key }}
      - name: Fetch the benchmark sets this pull request changes
        if: github.event_name == 'pull_request' && steps.changed.outputs.count != '0' && steps.checked.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 400 paths per pull keeps each --include argument well under Linux's 131,072-byte cap.
          xargs -r -n 400 -a "$RUNNER_TEMP/changed.txt" sh -c 'git lfs pull --include "$(printf "%s," "$@" | sed "s/,$//")" --exclude ""' sh
      - run: uv run pytest -q
      # Saved only after the tests passed with the sets fetched.
      - name: Remember the sets this run checked
        if: github.event_name == 'pull_request' && steps.changed.outputs.count != '0' && steps.checked.outputs.cache-hit != 'true'
        run: cp "$RUNNER_TEMP/changed.txt" .checked-sets
      - uses: actions/cache/save@v6
        if: github.event_name == 'pull_request' && steps.changed.outputs.count != '0' && steps.checked.outputs.cache-hit != 'true'
        with:
          path: .checked-sets
          key: ${{ steps.changed.outputs.key }}
